name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q
      - name: Prove it works (L1 + L2 + L5 + L3)
        run: |
          python -m benchmark.l1_conformance
          python -m benchmark.l2_ablation
          python -m precedence.experiment
          python -m precedence.live_agent
          python3 integrations/claude_code_hook.py --selftest
      - name: Smoke-test the demo + dashboard
        run: |
          python -m examples.demo_session
          test -f dashboard.html
      - name: Smoke-test the scoping prototype
        run: |
          python -m examples.composition_demo
          python -m examples.project_yield_demo
          python -m project_yield model
          python -m project_yield predict --description "Read 8 supplier contracts and reconcile the pricing terms, then report the variances."
