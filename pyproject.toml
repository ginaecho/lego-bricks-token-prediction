[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "openharness"
version = "0.1.0"
description = "Re-mount an agent's behavioral rules as an observable, testable, priced plugin layer — and put every rule on a harness-cards dashboard."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Gina Chen", email = "gina.tcchen@gmail.com" }]
keywords = [
    "ai-agents", "llm", "agent-harness", "observability", "governance",
    "guardrails", "conformance", "evaluation", "test-driven-development",
    "cost-estimation", "project-estimation", "azure",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
# Microsoft Agent Governance Toolkit — optional; enables openharness/agt.py to
# enforce OpenHarness policies on AGT's real engine. See docs/agt-integration.md.
agt = ["agent-governance-toolkit-core>=4.1.0"]

[project.urls]
Homepage = "https://github.com/ginaecho/lego-bricks-token-prediction"
Repository = "https://github.com/ginaecho/lego-bricks-token-prediction"

[project.scripts]
openharness = "openharness.cli:main"
project-yield = "project_yield.cli:main"

[tool.setuptools]
packages = ["openharness", "modules", "token_yield", "project_yield"]

[tool.setuptools.package-data]
project_yield = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
